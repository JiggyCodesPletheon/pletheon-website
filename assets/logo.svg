<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pletheon Media Network">
  <defs>
    <linearGradient id="pmn-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- black tile -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#0B1220" stroke="#1E3A8A" stroke-width="2"/>
  <!-- back page (offset, darker blue) gives a stacked-pages feel -->
  <path d="M24 15h12.5a12.5 12.5 0 0 1 0 25H31v9h-7z" fill="#1E3A8A" transform="translate(4 -2)"/>
  <!-- the P: stem + bowl, shaped like an open page -->
  <path d="M20 17h13.5a12.5 12.5 0 0 1 0 25H28v9h-8z" fill="url(#pmn-blue)"/>
  <!-- counter of the P -->
  <path d="M28 24.5h5.2a5 5 0 0 1 0 10H28z" fill="#0B1220"/>
  <!-- page line on the stem -->
  <path d="M23.5 21v26" stroke="#DBEAFE" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
</svg>
